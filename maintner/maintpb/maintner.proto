// https://developers.google.com/protocol-buffers/docs/proto3
syntax = "proto3";

import "google/protobuf/timestamp.proto";

package maintpb;

option go_package = "golang.org/x/build/maintner/maintpb";

message Mutation {
  GithubIssueMutation github_issue = 1; // issue-specific changes
  GithubMutation github = 3; // labels, milestones (not issue-specific)
  GithubActionsMutation github_actions = 5; // workflow runs and jobs
  GithubProjectMutation github_project = 6; // org-level project metadata

  GitMutation git = 2;
  GerritMutation gerrit = 4;
}

message GithubMutation {
  string owner = 1;  // "golang"
  string repo = 2;  // "go"

  // Updated labels. (All must have id set at least)
  repeated GithubLabel labels = 3;

  // Updated milestones. (All must have id set at least)
  repeated GithubMilestone milestones = 4;
}

message GithubIssueMutation {
  string owner = 1;  // "golang"
  string repo = 2;  // "go"
  int32 number = 3;  // 1, 2, 3... (not the ID)

  // not_exist is set true if the issue has been found to not exist.
  // If true, the owner/repo/number fields above must still be set.
  // If a future issue mutation for the same number arrives without
  // not_exist set, then the issue comes back to life.
  bool not_exist = 13;

  int64 id = 12;  // unique across all repos

  GithubUser user = 4;   // only set for new/updated issues, not new comments
  repeated GithubUser assignees = 10; // who the issue is assigned to
  repeated int64 deleted_assignees = 11; // IDs of users to delete from the assignee list
  google.protobuf.Timestamp created = 5; // only needed on new issues
  google.protobuf.Timestamp updated = 6; // only set on updated issue text
  string title = 9; // issue title

  // body_change changes the body field (the top post, which isn't a comment).
  // It is now used in preference to the old body field.
  StringChange body_change = 31;
  // body was the old way to change the body, but it doesn't support removing the
  // body text, which is common on PRs. New mutations use body_change instead.
  string body = 7;

  bool no_milestone = 15; // true unsets any previously-set milestone; false ignored.
  // When setting a milestone, only the milestone_id must be set.
  // TODO: allow num or title to be used if Github only returns those? So far unneeded.
  // The num and title, if non-zero, are treated as if they were a GithubMutation.Milestone update.
  int64 milestone_id = 16; // sets milestone to this milestone id (e.g. 2386495, global?)
  int64 milestone_num = 17; // sets milestone to this milestone number (e.g. 2, per-repo)
  string milestone_title = 18;

  BoolChange closed = 19;
  BoolChange locked = 25;

  bool pull_request = 28;  // true is the issue is a Pull Request

  google.protobuf.Timestamp closed_at = 21;
  GithubUser closed_by = 22;

  repeated int64 remove_label = 23; // label IDs to remove
  repeated GithubLabel add_label = 24;

  repeated GithubIssueCommentMutation comment = 8;
  GithubIssueSyncStatus comment_status = 14;

  repeated GithubIssueEvent event = 26;  // new events to add
  GithubIssueSyncStatus event_status = 27;

  repeated GithubReview review = 29;  // new reviews to add
  GithubIssueSyncStatus review_status = 30;

  repeated GithubReaction reaction = 32;        // reactions on the issue body
  repeated int64 removed_reaction_id = 33;      // reaction IDs removed from the issue body
  GithubIssueSyncStatus reaction_status = 34;   // sync cursor for reactions

  // PR-specific fields. Only set when pull_request is true.
  BoolChange draft = 35;
  BoolChange merged = 36;
  google.protobuf.Timestamp merged_at = 37;
  GithubUser merged_by = 38;
  string merge_commit_hash = 39;
  GithubPullRequestBranch head = 40;   // source branch
  GithubPullRequestBranch base = 41;   // target branch
  GithubIssueSyncStatus pr_detail_status = 42;  // sync cursor for PR detail fetch

  // Project membership and status.
  repeated GithubIssueProjectItem project_item = 43;     // add/update project items
  repeated string removed_project_item_id = 44;          // project node IDs to remove
  GithubIssueSyncStatus project_status = 45;              // sync cursor for project items
  repeated GithubProjectEvent project_event = 46;         // project timeline events to add
  GithubIssueSyncStatus project_event_status = 47;        // sync cursor for project events

  // issue_type is the native GitHub issue type name (e.g. "Bug", "Feature").
  // Empty for pull requests or issues with no type set.
  string issue_type = 48;

  // Org-level "Issue fields" (GitHub's structured issue metadata, distinct from
  // Projects V2 fields). issue_field carries the full current set as a snapshot
  // whenever any value changes; issue_fields_synced marks that snapshot
  // authoritative (including the all-cleared case where issue_field is empty),
  // distinguishing it from a mutation that simply doesn't touch issue fields.
  repeated GithubIssueFieldValue issue_field = 49;
  bool issue_fields_synced = 50;

  // Next tag: 51
}

// BoolChange represents a change to a boolean value.
// (Notably, the wrapper type permits representing a change to false.)
message BoolChange {
  bool val = 1;
}

// StringChange represents a change to a boolean value.
// (Notably, the wrapper type permits representing a change to the empty string.)
message StringChange {
  string val = 1;
}

message GithubLabel {
  int64 id = 1;
  string name = 2;
}

message GithubMilestone {
  int64 id = 1; // required

  // Following only need to be non-zero on changes:
  string title = 2;
  BoolChange closed = 3;
  int64 number = 4;
}

// See https://developer.github.com/v3/activity/events/types/#issuesevent
// for some info.
message GithubIssueEvent {
  // Required:
  int64 id = 1;

  // event_type can be one of "assigned", "unassigned", "labeled",
  // "unlabeled", "opened", "edited", "milestoned", "demilestoned",
  // "closed", "reopened", "referenced", "renamed" or anything else
  // that Github adds in the future.
  string event_type = 2;
  int64 actor_id = 3;
  google.protobuf.Timestamp created = 4; // time of the event

  // label is populated for "labeled" and "unlabeled" events.
  // The label will usually not have an ID, due to Github's API
  // not returning one.
  GithubLabel label = 5;

  // milestone is populated for "milestoned" and "demilestoned" events.
  // The label will usually not have an ID, due to Github's API
  // not returning one.
  GithubMilestone milestone = 6;

  // For "assigned", "unassigned":
  int64 assignee_id = 7; // always same as actor_id it seems? Github API doesn't say.
  int64 assigner_id = 8;

  // For "referenced", "closed":
  GithubCommit commit = 9;

  // For "renamed" events:
  string rename_from = 11;
  string rename_to = 12;

  int64 reviewer_id = 13;
  int64 review_requester_id = 14;
  GithubTeam team_reviewer = 16;
  // Contents of a dismissed review event, see dismissed_review in
  // https://developer.github.com/v3/issues/events/ for more info
  GithubDismissedReviewEvent dismissed_review = 15;

  // other_json is usually empty. If Github adds event types or fields
  // in the future, this captures those added fields. If non-empty it
  // will be a JSON object with the fields that weren't understood.
  bytes other_json = 10;

  // Next tag: 17.
}

// Contents of a dismissed review event - when someone leaves a
// review requesting changes and someone else dismisses it. See
// https://developer.github.com/v3/issues/events for more information.
message GithubDismissedReviewEvent {
  int64 review_id = 1; // ID of the review being dismissed
  reserved 2; // Old int64 "state" field. Do not use.
  string dismissal_message = 3;
  string state = 4; // commented, approved, changes_requested
}

message GithubCommit {
  string owner = 1;     // "golang"
  string repo = 2;      // "go"
  string commit_id = 3; // "0beec7b5ea3f0fdbc95d0dd47f3c5bc275da8a33"
}

// Contents of a pull request review - when someone
// comments, requests changes, or approves changes
// on a pull request. See
// https://developer.github.com/v3/pulls/reviews/ for more information.
message GithubReview {
  // Required:
  int64 id = 1;

  int64 actor_id = 2;
  google.protobuf.Timestamp created = 3;  // time of the event
  string body = 4;                        // body of the review comment
  string state = 5;  // COMMENTED, APPROVED, CHANGES_REQUESTED
  string commit_id = 6;
  string actor_association = 7;

  // other_json is usually empty.
  bytes other_json = 8;

  // Next tag: 9
}

// GithubIssueSyncStatus notes where syncing is at for comments
// on an issue,
// This mutation type is only made at/after the same top-level mutation
// which created the corresponding comments.
message GithubIssueSyncStatus {
  // server_date is the "Date" response header from Github for the
  // final HTTP response.
  google.protobuf.Timestamp server_date = 1;
}

message GithubIssueCommentMutation {
  int64 id = 1;
  GithubUser user = 2; // not present in edits later
  string body = 3;   // may not be present in edits later
  google.protobuf.Timestamp created = 4; // not present in edits later
  google.protobuf.Timestamp updated = 5;

  repeated GithubReaction reaction = 6;        // reactions on this comment
  repeated int64 removed_reaction_id = 7;      // reaction IDs removed from this comment

  // Next tag: 8
}

message GithubUser {
  int64 id = 1;
  string login = 2;
}

message GithubReaction {
  int64 id = 1;
  int64 user_id = 2;
  string content = 3;   // "+1", "-1", "laugh", "confused", "heart", "hooray", "rocket", "eyes"
  google.protobuf.Timestamp created = 4;
}

message GithubTeam {
  int64 id = 1;
  string slug = 2;
}

// GithubPullRequestBranch identifies a branch in a pull request (head or base).
message GithubPullRequestBranch {
  string ref = 1;       // branch name, e.g. "main" or "feature-x"
  string hash = 2;      // commit SHA
  string owner = 3;     // repo owner (may differ from issue owner for fork PRs)
  string repo = 4;      // repo name
}

message GitMutation {
  GitRepo repo = 1;

  // commit adds a commit, or adds new information to a commit if fields
  // are added in the future.
  GitCommit commit = 2;

  // ref_update records that a ref now points to a given hash.
  GitRef ref_update = 3;

  // tag adds an annotated tag object.
  GitTag tag = 4;
}

// GitRepo identifies a git repo being mutated.
message GitRepo {
  // If go_repo is set, it identifies a go.googlesource.com/<go_repo> repo.
  string go_repo = 1;

  // name is an arbitrary repo name, e.g. "tailscale/tailscale".
  // If set, go_repo is ignored.
  string name = 2;
}

message GitCommit {
  // hash is the full lowercase hex object hash.
  // Typically 40 hex bytes (SHA-1) but may be longer for SHA-256 repos.
  string hash = 1;

  // raw is the "git cat-file commit <hash>" output.
  bytes raw = 2;

  GitDiffTree diff_tree = 3;
}

// git diff-tree --numstat oldtree newtree
message GitDiffTree {
  repeated GitDiffTreeFile file = 1;
}

// GitDiffTreeFile represents one line of `git diff-tree --numstat` output.
message GitDiffTreeFile {
  string file = 1;
  int64  added = 2;
  int64  deleted = 3;
  bool   binary = 4;
}

// GitTag represents an annotated tag object. Lightweight tags do not have
// a tag object; they are just a ref pointing directly at a commit and are
// recorded only as a GitRef ref_update, not as a GitTag.
//
// For annotated tags, the ref (e.g. "refs/tags/v1.0") points to the tag
// object (hash), which in turn points to the tagged commit (target_hash).
message GitTag {
  // hash is the annotated tag object's own hex hash.
  // Typically 40 hex bytes (SHA-1) but may be longer for SHA-256 repos.
  // This is what the refs/tags/<name> ref points to.
  string hash = 1;
  // raw is the "git cat-file tag <hash>" output, containing the tag's
  // headers (object, type, tag, tagger) and the tag message.
  bytes raw = 2;
  // target_hash is the hex hash of the object this tag points to.
  // For the common case this is a commit hash. In rare cases a tag can
  // point to a tree, blob, or even another tag object.
  // Typically 40 hex bytes (SHA-1).
  string target_hash = 3;
}

message GerritMutation {
  // Project is the Gerrit server and project, without scheme (https implied) or
  // trailing slash.
  string project = 1; // "go.googlesource.com/go", "go.googlesource.com/net", etc

  // Commits to add.
  repeated GitCommit commits = 2;

  // git refs to update.
  repeated GitRef refs = 3;

  // deleted_refs are ref names to delete.
  repeated string deleted_refs = 4;
}

message GitRef {
  // ref is the git ref name, such as:
  //    HEAD
  //    refs/heads/master
  //    refs/changes/00/14700/1
  //    refs/changes/00/14700/meta
  //    refs/meta/config
  string ref = 1;

  // hash is the lowercase hex object hash.
  // Typically 40 hex bytes (SHA-1) but may be longer for SHA-256 repos.
  string hash = 2;
}

// GithubProjectMutation records org-level project metadata (title, field
// schemas). Emitted on first discovery and whenever metadata changes.
message GithubProjectMutation {
  string owner = 1;                                        // "tailscale"
  string project_node_id = 2;                              // "PVT_xxx"
  int64  project_number = 3;                               // project number within org
  string title = 4;
  repeated GithubProjectStatusOption status_options = 5;   // kept for backward compat (Status field options)
  BoolChange closed = 6;                                   // whether the project is closed
  repeated GithubProjectField fields = 7;                  // all custom fields with their schemas
}

// GithubProjectStatusOption is one option in a project's Status field.
// Kept for backward compatibility; new code uses GithubProjectField.options.
message GithubProjectStatusOption {
  string id = 1;     // GraphQL option ID
  string name = 2;   // "Todo", "In Progress", "Done", etc.
}

// GithubProjectField records the schema of one custom field on a project.
// Mirror fields (Labels, Assignees, etc.) are not tracked as they
// duplicate data already on the issue.
message GithubProjectField {
  string name = 1;                                     // display name, e.g. "Status", "Sprint"
  string type = 2;                                     // "single_select", "iteration", "text", "number", "date"
  repeated GithubProjectStatusOption options = 3;      // for single_select fields
  repeated GithubProjectIteration iterations = 4;      // for iteration fields
}

// GithubProjectIteration is one iteration in an iteration field.
message GithubProjectIteration {
  string id = 1;
  string title = 2;
  string start_date = 3;   // "YYYY-MM-DD"
  int32 duration = 4;      // days
}

// GithubIssueProjectItem records an issue's membership in one project.
message GithubIssueProjectItem {
  string project_node_id = 1;                              // "PVT_xxx" - which project
  string item_node_id = 2;                                 // "PVTI_xxx" - the project item ID
  string status_option_id = 3;                             // kept for backward compat (Status option ID)
  google.protobuf.Timestamp updated_at = 4;                // item's updatedAt from GraphQL
  repeated GithubProjectItemFieldValue field_values = 5;   // all custom field values
}

// GithubProjectItemFieldValue records one field's value on a project item.
message GithubProjectItemFieldValue {
  string field_name = 1;                       // e.g. "Status", "Sprint", "Story Points"
  oneof value {
    string single_select_option_id = 2;        // for single-select fields
    string iteration_id = 3;                   // for iteration fields
    string text_value = 4;                     // for text fields
    double number_value = 5;                   // for number fields
    string date_value = 6;                     // "YYYY-MM-DD" for date fields
  }
}

// GithubIssueFieldValue records one org-level "Issue field" value on an issue.
// These are GitHub's structured issue metadata, distinct from Projects V2
// fields. The value is the field's display string.
message GithubIssueFieldValue {
  string field_name = 1;   // the issue field's name
  string value = 2;        // the field's display value
}

// GithubProjectEvent is a project-related timeline event on an issue
// (added to project, removed from project, or status changed).
message GithubProjectEvent {
  string id = 1;                              // GraphQL node ID
  string event_type = 2;                      // "added", "removed", "status_changed"
  int64 actor_id = 3;
  google.protobuf.Timestamp created = 4;
  string project_node_id = 5;                 // which project
  bool was_automated = 6;
  // For "status_changed" events only:
  string previous_status = 7;                 // display name of previous status
  string status = 8;                          // display name of new status
}

// GithubActionsMutation records a GitHub Actions workflow run or job.
message GithubActionsMutation {
  string owner = 1;
  string repo = 2;
  GithubWorkflowRun run = 3;
  GithubWorkflowJob job = 4;
}

message GithubWorkflowRun {
  int64 id = 1;
  string name = 2;              // workflow name
  string head_branch = 3;
  string head_hash = 4;         // commit SHA
  string event = 5;             // "push", "pull_request", etc.
  string status = 6;            // "completed", "in_progress", "queued"
  string conclusion = 7;        // "success", "failure", "cancelled", etc.
  int64 workflow_id = 8;
  int64 run_number = 9;
  int64 run_attempt = 10;
  google.protobuf.Timestamp created = 11;
  google.protobuf.Timestamp updated = 12;
  google.protobuf.Timestamp run_started = 13;
  int64 actor_id = 14;
  string url = 15;              // html_url
  repeated int64 pull_request_numbers = 16;
}

message GithubWorkflowJob {
  int64 id = 1;
  int64 run_id = 2;
  string name = 3;
  string status = 4;            // "queued", "in_progress", "completed"
  string conclusion = 5;        // "success", "failure", etc.
  google.protobuf.Timestamp started = 6;
  google.protobuf.Timestamp completed = 7;
  string runner_name = 8;
  repeated string labels = 9;   // runner labels
  repeated GithubWorkflowStep step = 10;
}

message GithubWorkflowStep {
  string name = 1;
  string status = 2;
  string conclusion = 3;
  int64 number = 4;
  google.protobuf.Timestamp started = 5;
  google.protobuf.Timestamp completed = 6;
}
